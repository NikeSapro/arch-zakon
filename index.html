<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archimedes Lab v2.0 ⚡</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="lab-wrapper">
        <header>
            <div class="badge">PROJEKT: FYZIKA HROU</div>
            <h1>ARCHIMEDES <span class="neon-text">LAB v2.0</span></h1>
            <p>Hýbej s parametry a sleduj, kdy tě vztlaková síla zachrání!</p>
        </header>

        <div class="grid-layout">
            <section class="control-panel">
                <h2>🎛️ Nastavení experimentu</h2>
                
                <div class="slider-box">
                    <label>Hmotnost tělesa: <span id="weight-val">5</span> kg</label>
                    <input type="range" id="weight-slider" min="1" max="15" value="5" oninput="aktualizujLab()">
                </div>

                <div class="slider-box">
                    <label>Objem tělesa (velikost): <span id="volume-val">6</span> litrů</label>
                    <input type="range" id="volume-slider" min="1" max="15" value="6" oninput="aktualizujLab()">
                </div>

                <div class="preset-zone">
                    <h3>💡 Rychlé šablony:</h3>
                    <div class="preset-buttons">
                        <button onclick="nastavPreset(15, 2)">🔑 Těžký kov</button>
                        <button onclick="nastavPreset(2, 10)">🪵 Lehké dřevo</button>
                        <button onclick="nastavPreset(12, 14)">🚢 Ocelová loď</button>
                    </div>
                </div>
            </section>

            <section id="status-card" class="display-panel">
                <div class="screen-header">
                    <span class="dot"></span> LIVE DIAGNOSTIKA
                </div>

                <div id="graphic-status">🚢</div>

                <div class="metrics">
                    <div class="metric">
                        <span>Gravitační síla (dolů):</span>
                        <div class="bar-bg"><div id="fg-bar" class="bar red-bar" style="width: 50%;"></div></div>
                    </div>
                    <div class="metric">
                        <span>Vztlaková síla (nahoru):</span>
                        <div class="bar-bg"><div id="fb-bar" class="bar green-bar" style="width: 60%;"></div></div>
                    </div>
                </div>

                <h3 id="verdict-title">ANALÝZA TĚLESA</h3>
                <p id="verdict-desc">Uprav posuvníky vlevo pro spuštění fyzikální simulace.</p>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
